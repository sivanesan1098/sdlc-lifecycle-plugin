<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Background Gradient for subtle backing -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#833AB4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#111317" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Primary Gradients -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#818CF8"/>
      <stop offset="70%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="nodeContext" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="nodePlan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <linearGradient id="nodeTracker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="nodeVerify" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="128" cy="128" r="110" fill="url(#bgGlow)"/>

  <!-- SDLC Orbital Loop Track -->
  <circle cx="128" cy="128" r="82" stroke="#334155" stroke-width="6" stroke-dasharray="6 8" stroke-linecap="round" opacity="0.4"/>
  <path d="M 128 46 A 82 82 0 0 1 210 128" stroke="url(#orbitGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 210 128 A 82 82 0 0 1 128 210" stroke="url(#orbitGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 128 210 A 82 82 0 0 1 46 128" stroke="url(#orbitGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 46 128 A 82 82 0 0 1 128 46" stroke="url(#orbitGrad)" stroke-width="6" stroke-linecap="round"/>

  <!-- Directional Arrow Heads on Track -->
  <polygon points="186,62 196,52 182,48" fill="#818CF8"/>
  <polygon points="196,192 186,204 182,190" fill="#F43F5E"/>
  <polygon points="68,194 58,204 62,190" fill="#38BDF8"/>
  <polygon points="60,64 70,52 74,66" fill="#10B981"/>

  <!-- Central Core / Hub Badge -->
  <rect x="94" y="94" width="68" height="68" rx="18" fill="#1E293B" stroke="#475569" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Central Infinity / Loop Icon -->
  <path d="M 112 128 C 112 121 117 116 123 119 C 126 120 127 123 128 128 C 129 133 130 136 133 137 C 139 140 144 135 144 128 C 144 121 139 116 133 119 C 130 120 129 123 128 128 C 127 133 126 136 123 137 C 117 140 112 135 112 128 Z" 
        stroke="url(#orbitGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Satellite Node 1: Context (Top) -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="46" r="22" fill="url(#nodeContext)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Document lines icon inside Context node -->
    <rect x="120" y="38" width="16" height="16" rx="2" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <line x1="123" y1="43" x2="133" y2="43" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="123" y1="47" x2="133" y2="47" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="123" y1="51" x2="129" y2="51" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Satellite Node 2: Plan (Right) -->
  <g filter="url(#shadow)">
    <circle cx="210" cy="128" r="22" fill="url(#nodePlan)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Compass / Drafting icon inside Plan node -->
    <circle cx="210" cy="128" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="210,123 213,128 210,127 207,128" fill="#FFFFFF"/>
    <polygon points="210,133 213,128 210,129 207,128" fill="#E9D5FF"/>
  </g>

  <!-- Satellite Node 3: Tracker (Bottom) -->
  <g filter="url(#shadow)">
    <circle cx="128" cy="210" r="22" fill="url(#nodeTracker)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Checkmark List icon inside Tracker node -->
    <path d="M 121 210 L 125 214 L 135 204" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Satellite Node 4: Verify / Ship (Left) -->
  <g filter="url(#shadow)">
    <circle cx="46" cy="128" r="22" fill="url(#nodeVerify)" stroke="#FFFFFF" stroke-width="2.5"/>
    <!-- Shield / Check icon inside Verify node -->
    <path d="M 40 123 C 40 123 44 122 46 119 C 48 122 52 123 52 123 C 52 131 46 136 46 136 C 46 136 40 131 40 123 Z" 
          stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linejoin="round"/>
    <path d="M 43 128 L 45 130 L 49 125" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
